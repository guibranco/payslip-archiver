# docker compose -f deploy/docker-compose.yml up -d
#
# Secrets come from a .env file next to this one (never committed) — copy
# deploy/systemd/payslip-archiver.env to deploy/.env and fill it in.
services:
  payslip-archiver:
    build:
      context: ..
      args:
        VERSION: ${VERSION:-0.1.0}
    image: ghcr.io/guibranco/payslip-archiver:${VERSION:-latest}
    container_name: payslip-archiver
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOTNET_ENVIRONMENT: Production
      Ledger__Path: /data/ledger.db
    volumes:
      - payslip-data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  payslip-data:
