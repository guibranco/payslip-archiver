name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: two quick merges to main must not race each other onto the host or into the
# same version number.
concurrency:
  group: deploy
  cancel-in-progress: false

# Least privilege: the token is read-only everywhere except the release job, which needs contents: write.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

# Every push to main is built, tested, deployed to vinhedo3 as a systemd service and then tagged as a
# release. GitVersion computes the version from the commit messages (`+semver: major|minor|patch`,
# default patch); the tag is only created after the deploy succeeded, so a failed deploy can simply be
# re-run and lands on the same version.
#
# Repository secrets:
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_PORT (optional)   — the deploy user created by
#                                                                 deploy/scripts/bootstrap.sh (one-time,
#                                                                 as root; see README → Deploying)
#   SSH_KNOWN_HOSTS                                           — the host's public key(s) in known_hosts
#                                                                 format (`ssh-keyscan -p PORT HOST`,
#                                                                 verified against the fingerprints
#                                                                 bootstrap.sh prints); pinned so a
#                                                                 spoofed host can never receive the
#                                                                 rendered secrets
#   GRIMOIRE_BASE_URL, GRIMOIRE_API_KEY                       — where the service reads every other
#                                                                 setting and secret from at startup
#                                                                 (README → Grimoire)
#   GRIMOIRE_ENVIRONMENT (optional)                           — Grimoire environment slug, default
#                                                                 "production"
jobs:
  # ── 1. Build & test ──────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.gitversion.outputs.majorMinorPatch }}
      informationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔧 Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.x"

      - name: 🏷️ Determine Version Number
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: 🛡️ Check version is not already released
        env:
          VERSION: v${{ steps.gitversion.outputs.majorMinorPatch }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" > /dev/null; then
            echo "::error::Tag ${VERSION} already exists but GitVersion still computes it. Refusing to overwrite a published release."
            exit 1
          fi
          echo "Building ${VERSION}"

      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: 📦 Install qpdf
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qpdf

      - name: 🧩 Restore
        run: dotnet restore

      - name: 🏗️ Build
        run: >-
          dotnet build --no-restore --configuration Release
          -p:Version=${{ steps.gitversion.outputs.majorMinorPatch }}
          -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: 🧪 Test
        run: dotnet test --no-build --configuration Release

      - name: 🚀 Publish (linux-x64, single file)
        run: >-
          dotnet publish src/PayslipArchiver.Worker/PayslipArchiver.Worker.csproj
          --configuration Release --runtime linux-x64
          -p:Version=${{ steps.gitversion.outputs.majorMinorPatch }}
          -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}
          --output publish/linux-x64

      - name: 🗜️ Package release
        env:
          VERSION: ${{ steps.gitversion.outputs.majorMinorPatch }}
        run: |
          rm -f publish/linux-x64/*.pdb publish/linux-x64/appsettings.Development.json
          # The licence travels with every distributed build (AGPL §4/§5); the unit, installer and
          # bootstrap ship for bootstrap.sh — install.sh never installs them from the upload.
          cp LICENSE README.md publish/linux-x64/
          cp deploy/systemd/payslip-archiver.service publish/linux-x64/
          cp deploy/scripts/install.sh deploy/scripts/bootstrap.sh publish/linux-x64/
          echo "${VERSION}" > publish/linux-x64/VERSION
          mkdir -p dist
          tar -C publish/linux-x64 -czf "dist/payslip-archiver-${VERSION}-linux-x64.tar.gz" .
          (cd dist && sha256sum "payslip-archiver-${VERSION}-linux-x64.tar.gz" > "payslip-archiver-${VERSION}-linux-x64.tar.gz.sha256")
          ls -l dist

      - name: 📤 Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist
          retention-days: 7
          if-no-files-found: error

  # ── 2. Deploy to vinhedo3 ────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to vinhedo3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    environment: production

    steps:
      - name: 📥 Download release package
        uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: 🔑 Render environment file from secrets
        env:
          GRIMOIRE_BASE_URL: ${{ secrets.GRIMOIRE_BASE_URL }}
          GRIMOIRE_API_KEY: ${{ secrets.GRIMOIRE_API_KEY }}
          GRIMOIRE_ENVIRONMENT: ${{ secrets.GRIMOIRE_ENVIRONMENT }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for required in GRIMOIRE_BASE_URL GRIMOIRE_API_KEY; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Repository secret ${required} is not set"
              exit 1
            fi
          done
          umask 077
          # systemd EnvironmentFile syntax: inside double quotes only backslash and the quote itself are
          # special, so escaping those two keeps every secret byte-for-byte (including $, spaces, # …).
          q() { local v=${1//\\/\\\\}; v=${v//\"/\\\"}; printf '"%s"' "${v}"; }
          # Only the Grimoire bootstrap goes here: everything else is read from Grimoire at startup, and
          # any other key written to this file would override the Grimoire value.
          {
            echo "# Rendered by the Deploy workflow for v${VERSION}; edit the repository secrets, not this file."
            echo "Grimoire__BaseUrl=$(q "${GRIMOIRE_BASE_URL}")"
            echo "Grimoire__ApiKey=$(q "${GRIMOIRE_API_KEY}")"
            echo "Grimoire__Environment=$(q "${GRIMOIRE_ENVIRONMENT:-production}")"
          } > payslip-archiver.env
          echo "Rendered $(grep -c '=' payslip-archiver.env) settings"

      - name: 🔑 Write SSH key and pinned host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          for required in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Repository secret ${required} is not set (SSH_KNOWN_HOSTS: run 'ssh-keyscan -p ${SSH_PORT} ${SSH_HOST:-HOST}' from a trusted machine and check the fingerprints bootstrap.sh printed)"
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host key is pinned from a secret, never learned from the network on the runner: a spoofed
          # SSH_HOST must not be able to receive the rendered secrets.
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${SSH_HOST}
            Port ${SSH_PORT}
            User ${SSH_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: 📦 Upload release and secrets
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ssh deploy-target \
            "rm -rf ~/payslip-archiver-deploy && mkdir -p ~/payslip-archiver-deploy && chmod 700 ~/payslip-archiver-deploy"
          scp \
            "dist/payslip-archiver-${VERSION}-linux-x64.tar.gz" \
            "dist/payslip-archiver-${VERSION}-linux-x64.tar.gz.sha256" \
            payslip-archiver.env \
            "deploy-target:~/payslip-archiver-deploy/"

      - name: 🚀 Install and restart the service
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ssh deploy-target \
            VERSION="${VERSION}" bash -s <<'ENDSSH'
            set -euo pipefail
            cd ~/payslip-archiver-deploy
            echo "🔍 Verifying checksum"
            sha256sum -c "payslip-archiver-${VERSION}-linux-x64.tar.gz.sha256"
            echo "📂 Extracting release"
            rm -rf release && mkdir release
            tar -C release -xzf "payslip-archiver-${VERSION}-linux-x64.tar.gz"
            chmod +x release/payslip-archiver
            echo "⚙️  Installing v${VERSION}"
            # Only the root-owned installer that bootstrap.sh put in place may run with sudo; the release
            # and env file are passed to it as data. Its WARNING lines (unit/installer drift) are
            # surfaced as workflow warnings below.
            sudo /usr/local/sbin/payslip-archiver-install \
              "${HOME}/payslip-archiver-deploy/release" \
              "${HOME}/payslip-archiver-deploy/payslip-archiver.env" 2>&1 | tee install.log
            test "${PIPESTATUS[0]}" -eq 0
            grep '^WARNING:' install.log | sed 's/^WARNING: /::warning title=payslip-archiver-install::/' || true
            echo "🧹 Cleaning up"
            cd ~ && rm -rf ~/payslip-archiver-deploy
          ENDSSH

      - name: 🧹 Remove private key and secrets
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config ~/.ssh/known_hosts payslip-archiver.env

  # ── 3. Tag & GitHub release ──────────────────────────────────────────────────
  release:
    name: 📢 Tag & release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, deploy]
    permissions:
      contents: write

    steps:
      - name: 📥 Download release package
        uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: 🏷️ Create release
        uses: ncipollo/release-action@v1
        with:
          skipIfReleaseExists: true
          allowUpdates: false
          draft: false
          makeLatest: true
          commit: ${{ github.sha }}
          tag: v${{ needs.build.outputs.version }}
          name: Release v${{ needs.build.outputs.version }}
          generateReleaseNotes: true
          artifacts: dist/*
          body: |
            ## payslip-archiver v${{ needs.build.outputs.version }}

            Built from `${{ github.sha }}` (`${{ needs.build.outputs.informationalVersion }}`) and deployed to vinhedo3.

            The attached `payslip-archiver-${{ needs.build.outputs.version }}-linux-x64.tar.gz` is the self-contained
            build with the systemd unit and `install.sh`; see `deploy/scripts/install.sh` for the manual install.
