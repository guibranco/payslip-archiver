name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    # The job name is the status-check context the `main` ruleset requires ("build").
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 🔧 Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.x"

      - name: 🏷️ Determine Version Number
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The qpdf fallback decryptor has its own tests; they skip themselves when qpdf is absent.
      - name: 📦 Install qpdf
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qpdf

      - name: 🧩 Restore
        run: dotnet restore

      - name: 🎨 Check formatting
        run: dotnet format --no-restore --verify-no-changes

      - name: 🏗️ Build
        run: >-
          dotnet build --no-restore --configuration Release
          -p:Version=${{ steps.gitversion.outputs.semVer }}
          -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: 🧪 Test
        run: >-
          dotnet test --no-build --configuration Release
          --logger trx
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 14

      - name: 🚀 Publish (linux-x64, single file)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: >-
          dotnet publish src/PayslipArchiver.Worker/PayslipArchiver.Worker.csproj
          --configuration Release --runtime linux-x64
          -p:Version=${{ steps.gitversion.outputs.semVer }}
          -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}
          --output publish/linux-x64

      - name: 📤 Upload build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: payslip-archiver-${{ steps.gitversion.outputs.semVer }}-linux-x64
          path: publish/linux-x64
          retention-days: 30
