name: Build

on:
  pull_request:
  workflow_dispatch:

# The build job runs PR-controlled code (restore, build, tests) with a read-only token; only the small
# comment job below, which runs nothing from the PR, gets pull-requests: write.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    # The job name is the status-check context the `main` ruleset requires ("build").
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔧 Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.x"

      - name: 🏷️ Determine Version Number
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The qpdf fallback decryptor has its own tests; they skip themselves when qpdf is absent.
      - name: 📦 Install qpdf
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qpdf

      - name: 🧩 Restore
        run: dotnet restore

      - name: 🎨 Check formatting
        run: dotnet format --no-restore --verify-no-changes

      - name: 🏗️ Build
        run: >-
          dotnet build --no-restore --configuration Release
          -p:Version=${{ steps.gitversion.outputs.majorMinorPatch }}
          -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: 🧪 Test with coverage
        run: >-
          dotnet test --no-build --configuration Release
          --logger trx
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: 📊 Generate coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: CoverageReport
          reporttypes: HtmlInline;Cobertura;MarkdownSummaryGithub;Badges
          assemblyfilters: -*.Tests
          title: payslip-archiver

      - name: 📝 Publish coverage summary
        if: always()
        run: cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-and-coverage
          path: |
            TestResults
            CoverageReport
          retention-days: 14

  coverage-comment:
    name: 💬 Coverage comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build]
    if: always() && github.event_name == 'pull_request' && needs.build.result != 'cancelled'
    permissions:
      pull-requests: write

    steps:
      - name: 📥 Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: test-results-and-coverage
          path: reports

      - name: 💬 Comment coverage on the PR
        continue-on-error: true   # a fork PR's token is read-only; the job summary and artifact still carry the report
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: reports/CoverageReport/SummaryGithub.md
