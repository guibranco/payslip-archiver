<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- payslip-archiver: a payslip whose padlock has been opened. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F5F6B"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F3F2"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- document with a folded corner -->
  <g transform="rotate(-6 112 128)">
    <path d="M60 44 h80 l36 36 v120 a12 12 0 0 1 -12 12 h-104 a12 12 0 0 1 -12 -12 v-144 a12 12 0 0 1 12 -12 z"
          fill="url(#paper)"/>
    <path d="M140 44 v26 a10 10 0 0 0 10 10 h26 z" fill="#B7DAD6"/>
    <!-- header bar and amount lines -->
    <rect x="68" y="66" width="52" height="12" rx="6" fill="#0F766E"/>
    <rect x="68" y="98" width="88" height="8" rx="4" fill="#9CC9C4"/>
    <rect x="68" y="118" width="72" height="8" rx="4" fill="#9CC9C4"/>
    <rect x="68" y="138" width="80" height="8" rx="4" fill="#9CC9C4"/>
    <rect x="68" y="168" width="40" height="12" rx="6" fill="#0F766E"/>
  </g>

  <!-- unlocked padlock badge -->
  <circle cx="184" cy="184" r="52" fill="#0B2E35"/>
  <circle cx="184" cy="184" r="52" fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="6"/>
  <path d="M168 180 v-18 a17 17 0 0 1 34 0 v4" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <rect x="154" y="178" width="50" height="38" rx="8" fill="#FBBF24"/>
  <circle cx="179" cy="194" r="5" fill="#0B2E35"/>
  <rect x="176.5" y="195" width="5" height="11" rx="2.5" fill="#0B2E35"/>
</svg>